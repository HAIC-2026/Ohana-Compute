{{- if not (has .Values.identity.mode (list "disabled" "oidc")) }}
{{- fail "identity.mode must be disabled or oidc" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hawaii-resilience-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hawaii-resilience-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hawaii-resilience-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: '{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CENSUS_API_KEY_FILE
              value: /mnt/secrets-store/{{ .Values.azure.censusSecretName }}
            - name: TELEMETRY_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.telemetry.rateLimitPerMinute | quote }}
            - name: IDENTITY_MODE
              value: {{ .Values.identity.mode | quote }}
{{- if eq .Values.identity.mode "oidc" }}
            - name: OIDC_ISSUER_URL
              value: {{ required "identity.oidc.issuerURL is required when identity.mode=oidc" .Values.identity.oidc.issuerURL | quote }}
            - name: OIDC_AUDIENCE
              value: {{ required "identity.oidc.audience is required when identity.mode=oidc" .Values.identity.oidc.audience | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "identity.oidc.clientID is required when identity.mode=oidc" .Values.identity.oidc.clientID | quote }}
            - name: OIDC_ROLES_CLAIM
              value: {{ required "identity.oidc.rolesClaim is required when identity.mode=oidc" .Values.identity.oidc.rolesClaim | quote }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-key-vault
