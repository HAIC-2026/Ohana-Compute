apiVersion: apps/v1
kind: Deployment
metadata:
  name: hawaii-resilience-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hawaii-resilience-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hawaii-resilience-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: '{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CENSUS_API_KEY_FILE
              value: /mnt/secrets-store/{{ .Values.azure.censusSecretName }}
            - name: TELEMETRY_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.telemetry.rateLimitPerMinute | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-key-vault
