{{- if not (has .Values.identity.mode (list "disabled" "oidc")) }}
{{- fail "identity.mode must be disabled or oidc" }}
{{- end }}
{{- if not (has .Values.collaboration.persistence (list "disabled" "sqlite")) }}
{{- fail "collaboration.persistence must be disabled or sqlite" }}
{{- end }}
{{- if not (has .Values.staffAuth.mode (list "disabled" "oidc")) }}
{{- fail "staffAuth.mode must be disabled or oidc" }}
{{- end }}
{{- if and (eq .Values.staffAuth.mode "oidc") (ne .Values.collaboration.persistence "sqlite") }}
{{- fail "staffAuth requires durable collaboration.persistence=sqlite" }}
{{- end }}
{{- if and (eq .Values.collaboration.persistence "sqlite") (ne (int .Values.replicaCount) 1) }}
{{- fail "SQLite collaboration persistence requires replicaCount=1" }}
{{- end }}
{{- if not (has .Values.groundedPlanning.mode (list "disabled" "openai-compatible")) }}
{{- fail "groundedPlanning.mode must be disabled or openai-compatible" }}
{{- end }}
{{- if and (eq .Values.groundedPlanning.mode "openai-compatible") (ne .Values.identity.mode "oidc") }}
{{- fail "groundedPlanning requires identity.mode=oidc" }}
{{- end }}
{{- if and (eq .Values.groundedPlanning.mode "openai-compatible") (ne .Values.collaboration.persistence "sqlite") }}
{{- fail "groundedPlanning requires collaboration.persistence=sqlite" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hawaii-resilience-backend
spec:
  replicas: {{ .Values.replicaCount }}
{{- if eq .Values.collaboration.persistence "sqlite" }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hawaii-resilience-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hawaii-resilience-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend
{{- if eq .Values.staffAuth.mode "oidc" }}
      securityContext:
        fsGroup: 65532
{{- end }}
      containers:
        - name: backend
          image: '{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CENSUS_API_KEY_FILE
              value: /mnt/secrets-store/{{ .Values.azure.censusSecretName }}
            - name: TELEMETRY_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.telemetry.rateLimitPerMinute | quote }}
            - name: IDENTITY_MODE
              value: {{ .Values.identity.mode | quote }}
            - name: STAFF_AUTH_MODE
              value: {{ .Values.staffAuth.mode | quote }}
{{- if eq .Values.staffAuth.mode "oidc" }}
            - name: STAFF_PUBLIC_URL
              value: {{ required "staffAuth.publicURL is required" .Values.staffAuth.publicURL | quote }}
            - name: STAFF_OIDC_ISSUER
              value: {{ required "staffAuth.issuer is required" .Values.staffAuth.issuer | quote }}
            - name: STAFF_OIDC_CLIENT_ID
              value: {{ required "staffAuth.clientID is required" .Values.staffAuth.clientID | quote }}
            - name: STAFF_SESSION_LIFETIME
              value: {{ .Values.staffAuth.sessionLifetime | quote }}
            - name: STAFF_OIDC_CLIENT_SECRET_FILE
              value: /run/staff-client/client-secret
            - name: STAFF_DIRECTORY_FILE
              value: /run/staff-directory/directory.json
{{- end }}
            - name: COLLABORATION_PERSISTENCE
              value: {{ .Values.collaboration.persistence | quote }}
            - name: GROUNDED_AI_MODE
              value: {{ .Values.groundedPlanning.mode | quote }}
{{- if eq .Values.collaboration.persistence "sqlite" }}
            - name: COLLABORATION_SQLITE_PATH
              value: {{ required "collaboration.sqlite.path is required when persistence=sqlite" .Values.collaboration.sqlite.path | quote }}
{{- end }}
{{- if eq .Values.groundedPlanning.mode "openai-compatible" }}
            - name: GROUNDED_AI_ENDPOINT
              value: {{ required "groundedPlanning.endpoint is required" .Values.groundedPlanning.endpoint | quote }}
            - name: GROUNDED_AI_ALLOWED_ENDPOINTS
              value: {{ required "groundedPlanning.allowedEndpoints is required" .Values.groundedPlanning.allowedEndpoints | quote }}
            - name: GROUNDED_AI_MODEL
              value: {{ required "groundedPlanning.model is required" .Values.groundedPlanning.model | quote }}
            - name: GROUNDED_AI_ALLOWED_MODELS
              value: {{ required "groundedPlanning.allowedModels is required" .Values.groundedPlanning.allowedModels | quote }}
            - name: GROUNDED_AI_TIMEOUT
              value: {{ .Values.groundedPlanning.timeout | quote }}
            - name: GROUNDED_AI_MAX_OUTPUT_TOKENS
              value: {{ .Values.groundedPlanning.maxOutputTokens | quote }}
            - name: GROUNDED_AI_API_KEY_FILE
              value: /mnt/secrets-store/{{ .Values.azure.groundedPlanningSecretName }}
{{- end }}
{{- if eq .Values.identity.mode "oidc" }}
            - name: OIDC_ISSUER_URL
              value: {{ required "identity.oidc.issuerURL is required when identity.mode=oidc" .Values.identity.oidc.issuerURL | quote }}
            - name: OIDC_AUDIENCE
              value: {{ required "identity.oidc.audience is required when identity.mode=oidc" .Values.identity.oidc.audience | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "identity.oidc.clientID is required when identity.mode=oidc" .Values.identity.oidc.clientID | quote }}
            - name: OIDC_ROLES_CLAIM
              value: {{ required "identity.oidc.rolesClaim is required when identity.mode=oidc" .Values.identity.oidc.rolesClaim | quote }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
{{- if eq .Values.staffAuth.mode "oidc" }}
            - name: staff-client
              mountPath: /run/staff-client
              readOnly: true
            - name: staff-directory
              mountPath: /run/staff-directory
              readOnly: true
{{- end }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
{{- if eq .Values.collaboration.persistence "sqlite" }}
            - name: collaboration-data
              mountPath: {{ dir .Values.collaboration.sqlite.path | quote }}
{{- end }}
      volumes:
{{- if eq .Values.staffAuth.mode "oidc" }}
        - name: staff-client
          secret:
            secretName: {{ required "staffAuth.clientSecret.name is required" .Values.staffAuth.clientSecret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.staffAuth.clientSecret.key | quote }}
                path: client-secret
        - name: staff-directory
          secret:
            secretName: {{ required "staffAuth.directorySecret.name is required" .Values.staffAuth.directorySecret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.staffAuth.directorySecret.key | quote }}
                path: directory.json
{{- end }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-key-vault
{{- if eq .Values.collaboration.persistence "sqlite" }}
        - name: collaboration-data
          persistentVolumeClaim:
            claimName: hawaii-resilience-collaboration
{{- end }}
