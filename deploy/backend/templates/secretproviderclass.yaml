apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-key-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "azure.workloadIdentityClientId is required" .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" .Values.azure.keyVaultName | quote }}
    tenantId: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.azure.censusSecretName }}
          objectType: secret
          objectVersion: ""
{{- if eq .Values.groundedPlanning.mode "openai-compatible" }}
        - |
          objectName: {{ required "azure.groundedPlanningSecretName is required" .Values.azure.groundedPlanningSecretName }}
          objectType: secret
          objectVersion: ""
{{- end }}
