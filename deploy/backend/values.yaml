replicaCount: 1

image:
  repository: ''
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: '1'

telemetry:
  rateLimitPerMinute: 1200

identity:
  mode: disabled
  oidc:
    issuerURL: ''
    audience: ''
    clientID: ''
    rolesClaim: roles

azure:
  tenantId: ''
  workloadIdentityClientId: ''
  keyVaultName: ''
  censusSecretName: census-api-key

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
