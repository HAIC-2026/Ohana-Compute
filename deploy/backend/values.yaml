replicaCount: 1

image:
  repository: ''
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: '1'

telemetry:
  rateLimitPerMinute: 1200

identity:
  mode: disabled
  oidc:
    issuerURL: ''
    audience: ''
    clientID: ''
    rolesClaim: roles

staffAuth:
  mode: disabled
  publicURL: ''
  issuer: ''
  clientID: ''
  sessionLifetime: 8h
  clientSecret:
    name: ''
    key: client-secret
  directorySecret:
    name: ''
    key: directory.json

collaboration:
  persistence: disabled
  sqlite:
    path: /var/lib/hawaii-resilience/collaboration.db
    storageClassName: ''
    size: 2Gi

groundedPlanning:
  mode: disabled
  endpoint: ''
  allowedEndpoints: ''
  model: ''
  allowedModels: ''
  timeout: 15s
  maxOutputTokens: 1024

azure:
  tenantId: ''
  workloadIdentityClientId: ''
  keyVaultName: ''
  censusSecretName: census-api-key
  groundedPlanningSecretName: grounded-ai-api-key

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
